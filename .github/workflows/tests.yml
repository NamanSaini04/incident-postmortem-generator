# Runs the full test suite on every push and pull request. No API key is needed:
# every LLM call in the tests is scripted with FakeClient.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev,llm,app]"
      - name: Test
        run: python -m pytest -q
