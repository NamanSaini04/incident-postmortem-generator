# Dashboard theme: dark "security operations" look. Delete this file for Streamlit's default light theme.
[theme]
base = "dark"
primaryColor = "#38BDF8"              # sky blue: tabs, buttons, selected items
backgroundColor = "#0B1220"           # page
secondaryBackgroundColor = "#131C2E"  # sidebar, tables, code blocks
textColor = "#E2E8F0"
font = "sans serif"
