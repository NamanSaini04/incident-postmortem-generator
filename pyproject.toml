[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmgen"
version = "0.1.0"
description = "Evidence-grounded cybersecurity incident postmortem generator (defensive use only)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=2.12"]
app = ["streamlit>=1.40", "plotly>=5.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
